services:
  # Backend Web Service (Node.js + Express + Prisma)
  - type: web
    name: pharmdverse-api
    env: node
    region: singapore
    plan: starter
    buildCommand: cd server && npm install && npx prisma generate
    startCommand: cd server && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pharmdverse-db
          property: connectionString

databases:
  # Managed PostgreSQL Database
  - name: pharmdverse-db
    databaseName: pharmdverse_erp
    user: pharmdverse_admin
    region: singapore
    plan: starter
